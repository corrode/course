[package]
name = "course-server"
version.workspace = true
edition.workspace = true
publish = false
default-run = "server"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
course-types.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1.0"
tokio.workspace = true
reqwest.workspace = true
ulid = "3.0"
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7", features = ["fs"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
# The workspace keeps templates at the repository root (see askama.toml).
askama = { version = "0.16", default-features = false, features = ["config", "derive", "std"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
env_logger = "0.11"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
log = "0.4"
sha2 = "0.11"
syn = { version = "3", default-features = false, features = ["full", "parsing"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.10"
url = "2.5"

[lints]
workspace = true
