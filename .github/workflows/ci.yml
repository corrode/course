name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, linting, the binary build, unit tests, and the exercise
  # check all share the same compiled dependency cache, so they live in
  # one job to avoid recompiling axum/sqlx five times over.
  rust:
    name: rustfmt, clippy, build, test, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Cheapest check first: only reads the committed source. The
      # `build.rs`-generated chapter `main.rs` files are committed and
      # must stay rustfmt-clean.
      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all --check

      # Lint the library and binaries. The exercise examples are linted
      # separately by scripts/check-examples.sh (some intentionally do
      # not compile).
      - name: Clippy (library + binaries)
        run: cargo clippy --locked --lib --bins -- -D warnings

      - name: Build binaries (cli + server)
        run: cargo build --locked --bins

      - name: Unit tests (library + binaries)
        run: cargo test --locked --lib --bins

      # Verify every exercise chapter compiles and lints clean, except the
      # handful of deliberately-broken teaching chapters, which must still
      # fail to compile.
      - name: Verify exercises
        run: ./scripts/check-examples.sh

      # Verify every solution under solutions/ compiles and its tests
      # pass (std-only files, run via rustc --test). REQUIRE_COMPLETE=1
      # also fails if any exercise step is missing a solution.
      - name: Verify solutions
        run: REQUIRE_COMPLETE=1 ./scripts/check-solutions.sh

  javascript:
    name: JavaScript bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild local CodeMirror and Lezer bundles
        run: npm run build:js
      - name: Verify generated bundles are current
        run: git diff --exit-code -- static/dist

  spellcheck:
    name: Spell check (typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run typos
        uses: crate-ci/typos@master

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Persist lychee's response cache between runs so unchanged links
      # aren't re-fetched on every push.
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir .
            --config ./lychee.toml
            --no-progress
            README.md
            docs
            examples
            static/cheatsheet.md
          fail: true

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [rust, javascript, spellcheck, link-check]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests still build the production image after all checks pass,
      # but only main pushes and manual main runs publish it.
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/corrode/course:latest
            ghcr.io/corrode/course:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --request GET \
            "https://admin.corrode.dev/api/v1/deploy?uuid=m96wwge88xkdbol0xew33te9&force=false" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --fail \
            --show-error
