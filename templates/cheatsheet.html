{% extends "base.html" %} {% block topbar_active_cheatsheet %}is-active{% endblock %} {% block
content %}
<div class="container">
    <div class="chapter-prose exercise-prose">{{ html|safe }}</div>
</div>

<script type="module">
    // Reuse the same Lezer-Rust prose highlighter as the exercise pages.
    const blocks = [...document.querySelectorAll(".exercise-prose pre > code")]
        .filter((el) => !el.className || el.classList.contains("language-rust"));
    if (blocks.length) {
        try {
            const { highlightRust } = await import("/static/dist/rust-highlight.js");
            blocks.forEach((el) => {
                el.innerHTML = highlightRust(el.textContent);
            });
        } catch (e) {
            console.warn("cheatsheet syntax highlighting failed", e);
        }
    }
</script>
{% endblock %}
