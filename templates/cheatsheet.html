{% extends "base.html" %} {% block title %}Cheatsheet | corrode Rust Course{%
endblock %} {% block topbar_active_cheatsheet %}is-active{% endblock %} {% block
content %}
<div class="container">
    <div class="chapter-prose exercise-prose">{{ html|safe }}</div>
</div>

<script type="module">
    // Reuse the same Lezer-Rust prose highlighter as the exercise pages.
    try {
        const { highlightRust } = await import(
            "/static/dist/rust-highlight.js"
        );
        document
            .querySelectorAll(".exercise-prose pre > code")
            .forEach((el) => {
                const cls = el.className || "";
                if (cls && !cls.includes("language-rust")) return;
                el.innerHTML = highlightRust(el.textContent);
            });
    } catch (e) {
        console.warn("cheatsheet syntax highlighting failed", e);
    }
</script>
{% endblock %}
