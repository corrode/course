<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<title>Inline editor browser regression checks</title>
<link rel="stylesheet" href="/static/css/base.css">
<style id="workflow-styles">
  body { padding: 2rem; }
  main { max-width: 1100px; margin: auto; }
  .toolbar { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; }
  .toolbar [data-role="action-status"] { margin-right: auto; }
  [data-role="editor-fallback"] { width: 100%; height: 200px; }
  [data-role="output-stderr"] { padding: 1rem; white-space: pre-wrap; }
  #checks { margin-top: 2rem; white-space: pre-wrap; }
</style>
<main>
<h1>Inline editor regression checks</h1>
<section class="exercise-section" id="exercise" data-exercise-key="browser-check">
  <div class="toolbar">
    <span data-role="action-status"></span>
    <button class="btn" data-role="reset-btn">Reset</button>
    <button class="btn" data-role="copy-btn">Copy</button>
    <button class="btn" data-role="format-btn">Format</button>
    <button class="btn" data-role="run-btn">Run</button>
    <button class="btn" data-role="submit-btn">Submit</button>
  </div>
  <div><textarea data-role="editor-fallback">fn main() {
    todo!()
}
</textarea><div data-role="editor-mount"></div></div>
  <span data-role="run-spinner" class="run-spinner" style="display:none" aria-hidden="true"></span>
  <p data-role="run-status"></p>
  <div data-role="output-panel" style="display:none">
    <ul data-role="test-list"></ul>
    <details data-role="output-details"><summary>Full output</summary><pre data-role="output-stderr"></pre></details>
  </div>
</section>
<pre id="checks" data-result="running">Running browser checks…</pre>
</main>
<script type="module">
import { mountInlineEditor, setVimGlobal } from "/static/dist/inline-editor.js";
if (!new URLSearchParams(location.search).has("layout")) {
const checks = document.querySelector("#checks");
const messages = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); messages.push(message); };
const tick = () => new Promise((resolve) => setTimeout(resolve, 20));
const section = document.querySelector("#exercise");
const role = (name) => section.querySelector(`[data-role="${name}"]`);
const pending = [];
const green = { success: true, test_results: [{ name: "example", passed: true }], stdout: "test example ... ok", stderr: "compiler warning" };
const oldFetch = window.fetch;
const panel = role("output-panel");
const originalScroll = panel.scrollIntoView;
const scrollPreference = "corrode:editor:scroll-output";
const originalScrollPreference = localStorage.getItem(scrollPreference);
window.fetch = (url, options) => new Promise((resolve) => pending.push({ url, options, resolve: (data) => resolve({ ok: true, json: async () => data }) }));
let view, cm;
const browserErrors = [];
window.addEventListener("error", (event) => browserErrors.push(event.message));
window.addEventListener("unhandledrejection", (event) => browserErrors.push(String(event.reason)));
try {
  const options = {
    slug: "browser-check",
    features: {
      vim: true,
      draftKey: "browser-regression-draft",
      submit: { ulid: "browser-test", exerciseKey: "browser-check" },
      buildExtraExtensions(modules) {
        cm = modules;
        return modules.view.ViewPlugin.define((editor) => { view = editor; return {}; });
      },
    },
  };
  const api = await mountInlineEditor(section, options);
  assert(!!view, "CodeMirror mounts rather than falling back");
  assert(await mountInlineEditor(section, options) === api, "Mounting twice is idempotent");
  assert(api.getValue().includes("\n    todo!()"), "Starter code retains rustfmt's four-space indentation");
  api.setValue("fn char_count(text: &str) -> usize {\n}");
  view.dispatch({ selection: { anchor: api.getValue().indexOf("{") + 1 } });
  cm.commands.insertNewlineAndIndent(view);
  assert(api.getValue() === "fn char_count(text: &str) -> usize {\n    \n}", "Enter after an opening brace inserts four spaces");
  assert(view.contentDOM.getAttribute("aria-label").includes("Rust code editor"), "Editor has an accessible name");
  view.dispatch({ selection: { anchor: 5 } });
  assert(view.dom.classList.contains("inline-rust-editor"), "Editor chrome survives CodeMirror updates");

  role("format-btn").click();
  const staleFormat = pending.shift();
  api.setValue("fn newer() {}\n");
  staleFormat.resolve({ success: true, code: "fn old() {}\n" });
  await tick();
  assert(api.getValue() === "fn newer() {}\n", "A late Format response cannot overwrite new edits");

  role("run-btn").click();
  const staleRun = pending.shift();
  api.setValue("fn newest() {}\n");
  staleRun.resolve(green);
  await tick();
  assert(pending.length === 0 && role("submit-btn").style.display === "none", "A late Run cannot submit or label a newer version");

  const unformatted = 'fn main(){\n    let answer=42;\n    println!("{answer}");\n}\n';
  api.setValue(unformatted);
  view.dispatch({ selection: { anchor: unformatted.indexOf("println") + 4 } });
  const beforeCursor = view.state.selection.main.head;
  role("format-btn").click();
  pending.shift().resolve({ success: true, code: 'fn main() {\n    let answer = 42;\n    println!("{answer}");\n}\n' });
  await tick();
  assert(view.state.selection.main.head === api.getValue().indexOf("println") + 4, "Formatting preserves the cursor across multiple whitespace edits");
  assert(api.getValue() === 'fn main() {\n    let answer = 42;\n    println!("{answer}");\n}\n', "Format preserves rustfmt output verbatim");
  cm.commands.undo(view);
  assert(api.getValue() === unformatted && view.state.selection.main.head === beforeCursor, "Formatting is one undo step with restored selection");

  const linkDoc = "// https://example.com/full/path\nfn main() {}\n";
  api.setValue(linkDoc);
  await tick();
  const opened = [];
  window.open = (...args) => opened.push(args);
  const coords = view.coordsAtPos(linkDoc.indexOf("example") + 4);
  const mouse = (ctrlKey) => new MouseEvent("mousedown", { button: 0, ctrlKey, clientX: coords.left + 1, clientY: (coords.top + coords.bottom) / 2, bubbles: true, cancelable: true });
  view.contentDOM.dispatchEvent(mouse(false));
  view.contentDOM.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
  assert(opened.length === 0, "Plain clicking a URL does not open a tab");
  view.contentDOM.dispatchEvent(mouse(true));
  assert(opened[0]?.[0] === "https://example.com/full/path", "Modified clicking opens the whole URL across syntax spans");

  setVimGlobal(true);
  await tick();
  assert(view.scrollDOM.classList.contains("cm-vimMode"), "Vim can be enabled after mounting");
  const key = (name, keyCode) => new KeyboardEvent("keydown", { key: name, code: name, keyCode, bubbles: true, cancelable: true });
  view.contentDOM.dispatchEvent(key("Escape", 27));
  const tab = key("Tab", 9);
  view.contentDOM.dispatchEvent(tab);
  assert(!tab.defaultPrevented, "Escape then Tab escapes the editor even in Vim mode");
  setVimGlobal(false);

  role("run-btn").click();
  pending.shift().resolve(green);
  await tick();
  assert(pending[0]?.url === "/api/submit", "A current passing run autosubmits");
  pending.shift().resolve({});
  await tick();
  assert(role("run-btn").style.display !== "none" && !role("run-btn").disabled, "Run remains available after saving");
  assert(role("submit-btn").disabled && role("submit-btn").textContent.includes("Submitted"), "Saved state describes the current passing source");
  assert(role("output-stderr").textContent.includes("compiler warning") && role("output-stderr").textContent.includes("test example"), "Output shows stdout and stderr together");
  api.setValue(api.getValue() + "// edit\n");
  assert(role("output-panel").style.display === "block" && !section.querySelector(".editor-stale-results").hidden, "Diagnostics stay available while editing, clearly marked stale");
  window.dispatchEvent(new Event("pagehide"));
  assert(localStorage.getItem("browser-regression-draft") === api.getValue(), "Navigation flushes the latest draft immediately");

  const draft = api.getValue();
  api.destroy();
  assert(!section.querySelector(".cm-editor"), "Destroy removes the CodeMirror view");
  const remounted = await mountInlineEditor(section, options);
  assert(remounted.getValue() === draft && section.querySelectorAll(".cm-editor").length === 1, "Remount restores the draft without duplicating editors");
  role("run-btn").click();
  pending.shift().resolve({ ...green, success: false });
  await tick();
  assert(pending.length === 0 && !role("run-status").textContent.includes("passed"), "A failed process cannot autosubmit even if parsed test lines passed");
  role("run-btn").click();
  const log = '---- example stdout ----\nthread \'example\' panicked at src/main.rs:4:5:\nassertion `left == right` failed\n left: None\nright: Some(2)\n\nfailures:\n    example\n\ntest result: FAILED. 0 passed; 1 failed\n';
  const diagnostic = 'error[E0308]: mismatched types\n --> src/main.rs:2:5\n2 | let value = Some(42);\nhelp: try `Some(2)`\n<img src=x onerror=alert(1)>';
  pending.shift().resolve({ success: false, stdout: log, stderr: diagnostic, test_results: [{ name: "example", passed: false }] });
  await tick();
  assert(role("output-stderr").textContent === log + "\n\n" + diagnostic, "Highlighted output preserves every character in both streams");
  assert(!role("output-stderr").querySelector("img"), "Program output cannot inject HTML");
  for (const theme of ["light", "dark"]) {
    document.documentElement.dataset.theme = theme;
    for (const output of [role("output-stderr"), section.querySelector(".editor-test-detail")]) {
      const number = output.querySelector(".tok-number");
      assert(number && getComputedStyle(number).color !== getComputedStyle(output).color, `Rust values are syntax-highlighted in ${theme} output`);
    }
  }
  assert(role("output-stderr").querySelector(".output-error") && role("output-details").open, "Failed runs expose highlighted diagnostics in the expanded log");
  const scrolls = [];
  panel.scrollIntoView = function (options) {
    scrolls.push({ options, visible: getComputedStyle(this).display !== "none", text: role("output-stderr").textContent });
    originalScroll.call(this, options);
  };
  localStorage.removeItem(scrollPreference);
  role("run-btn").click();
  assert(scrolls.length === 0, "Starting a run does not scroll before the response");
  assert(getComputedStyle(role("run-spinner")).display !== "none" && getComputedStyle(role("run-spinner")).animationName === "run-spin", "The shared running spinner is visible and animated while awaiting the response");
  pending.shift().resolve({ success: false, stderr: "new diagnostics", test_results: [] });
  await tick();
  assert(scrolls.length === 1 && scrolls[0].visible && scrolls[0].text === "new diagnostics", "Receiving the response renders output then scrolls to it");
  assert(scrolls[0].options.behavior === (matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth"), "Output scrolling respects the motion preference");
  assert(getComputedStyle(role("run-spinner")).display === "none", "The running spinner stops when the response arrives");
  localStorage.setItem(scrollPreference, "0");
  role("run-btn").click();
  assert(scrolls.length === 1 && role("run-spinner").style.display !== "none", "Disabling output scrolling keeps the running indicator");
  pending.shift().resolve({ success: false, stderr: "opt-out diagnostics", test_results: [] });
  await tick();
  assert(scrolls.length === 1, "Disabled scrolling stays disabled after results arrive");

  assert(browserErrors.length === 0, `No browser errors: ${browserErrors.join("; ")}`);
  checks.dataset.result = "passed";
  checks.textContent = `${messages.length} browser checks passed\n` + messages.map((message) => `✓ ${message}`).join("\n");
} catch (error) {
  checks.dataset.result = "failed";
  checks.textContent = messages.join("\n") + "\nFAILED: " + error.stack;
} finally {
  window.fetch = oldFetch;
  panel.scrollIntoView = originalScroll;
  if (originalScrollPreference === null) localStorage.removeItem(scrollPreference);
  else localStorage.setItem(scrollPreference, originalScrollPreference);
}
}
</script>
<script type="module">
import { mountInlineEditor } from "/static/dist/inline-editor.js";
const params = new URLSearchParams(location.search);
if (params.has("layout")) {
  const checks = document.querySelector("#checks");
  const messages = [];
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
    messages.push(message);
  };
  const tick = () => new Promise(resolve => setTimeout(resolve, 100));
  const originalFetch = window.fetch;
  const pending = [];
  const errors = [];
  window.addEventListener("error", event => errors.push(event.message));
  window.addEventListener("unhandledrejection", event => errors.push(String(event.reason)));
  let section, view, api;
  try {
    const kind = params.get("layout");
    assert(["exercise", "playground", "tour", "index"].includes(kind), "Known production template");
    const template = await originalFetch(`/templates/${kind}.html`).then(response => response.text());
    // Use the real template's editor markup and CSS, not a parallel test layout.
    // Enable the chapter's conditional controls; replace only server-side data.
    const markup = template.match(/<section\b[\s\S]*?<\/section>/g)
      .find(html => /class="[^"]*\bexercise-section\b/.test(html))
      .replace(/{%[\s\S]*?%}|{#[\s\S]*?#}/g, "")
      .replace(/{{[\s\S]*?}}/g, "Geometry exercise");
    const parsed = new DOMParser().parseFromString(markup, "text/html");
    section = parsed.querySelector(".exercise-section");
    document.querySelector("#workflow-styles").remove();
    for (const style of template.match(/<style>[\s\S]*?<\/style>/g) || [])
      document.head.insertAdjacentHTML("beforeend", style);
    document.body.replaceChildren();
    const topbar = document.createElement("header");
    topbar.className = "topbar";
    const elsewhere = document.createElement("button");
    elsewhere.textContent = "Course";
    topbar.append(elsewhere);
    const main = document.createElement("main");
    main.className = kind === "index" ? "container book-dashboard" : "container";
    main.innerHTML = `<h1>${kind === "index" ? "Warm-up" : kind} editor</h1><p>Production template layout regression fixture.</p>`;
    main.append(section);
    // The homepage explicitly removes the shared topbar.
    document.body.append(kind === "index" ? elsewhere : topbar, main, checks);
    const role = name => section.querySelector(`[data-role="${name}"]`);
    const source = "fn main() {\n" + Array.from({length: 98}, (_, i) => `    // Source line ${i + 2}`).join("\n") + "\n}";
    role("editor-fallback").value = source;
    const next = section.cloneNode(true);
    next.removeAttribute("id");
    for (const node of next.querySelectorAll("[id]")) node.removeAttribute("id");
    main.append(next);
    window.fetch = (url, options) => new Promise(resolve => pending.push({
      url, options, resolve: data => resolve({ok: true, json: async () => data}),
    }));
    localStorage.removeItem("corrode:editor:scroll-output");
    localStorage.removeItem("corrode:editor:vim");
    api = await mountInlineEditor(section, {slug: "geometry", features: {
      submit: kind === "exercise" ? {ulid: "fixture", exerciseKey: "geometry"} : null,
      buildExtraExtensions(modules) {
        return modules.view.ViewPlugin.define(editor => { view = editor; return {}; });
      },
    }});
    await mountInlineEditor(next, {slug: "next-geometry", features: {
      buildExtraExtensions() { throw new Error("Intentional textarea fallback fixture"); },
    }});
    assert(!!view, "CodeMirror mounted from the committed bundle");
    if (kind === "playground") {
      // Exercise the actual fullscreen handler, without running the page's mount script.
      const fullscreen = template.match(/\(function wireFullscreen\(\) \{[\s\S]*?\}\)\(\);/)[0];
      const script = document.createElement("script");
      script.textContent = fullscreen;
      document.body.append(script);
    }
    await tick();
    const toolbar = role("editor-toolbar");
    const panel = role("output-panel");
    const rect = element => element.getBoundingClientRect();
    const visibleControls = label => {
      const head = rect(toolbar);
      const bar = rect(topbar);
      assert(head.top >= bar.bottom - 1 && head.bottom <= innerHeight, `${label}: toolbar fits below navigation`);
      for (const button of toolbar.querySelectorAll("button, a")) {
        if (!button.getClientRects().length) continue;
        const r = rect(button);
        assert(r.left >= 0 && r.right <= innerWidth + 1 && r.top >= head.top && r.bottom <= innerHeight, `${label}: ${button.dataset.role} fits`);
        const hit = document.elementFromPoint((r.left + r.right) / 2, (r.top + r.bottom) / 2);
        assert(hit && button.contains(hit), `${label}: ${button.dataset.role} is not obscured`);
      }
      assert(document.documentElement.scrollWidth <= innerWidth, `${label}: no horizontal page overflow`);
    };
    const showSource = async () => {
      view.dispatch({selection: {anchor: view.state.doc.line(50).from, head: view.state.doc.line(50).from + 6}, scrollIntoView: true});
      await tick();
      visibleControls("Source");
    };
    const scrolls = [];
    const originalScroll = panel.scrollIntoView;
    panel.scrollIntoView = function(options) { scrolls.push(options); originalScroll.call(this, options); };
    const failure = {success: false, stderr: "error[E0308]: mismatched types\n --> src/main.rs:80:5\n80 | let broken: u8 = true;", test_results: []};
    const resultsVisible = label => {
      visibleControls(label);
      assert(rect(panel).top >= rect(toolbar).bottom - 1 && rect(panel).top < innerHeight - 30, `${label}: results start below the toolbar, in view`);
    };
    const finish = async data => {
      pending.shift().resolve(data);
      await tick();
      if (pending[0]?.url === "/api/submit") { pending.shift().resolve({}); await tick(); }
      // Allow native smooth scrolling to finish (also used when reduced motion is off).
      await new Promise(resolve => setTimeout(resolve, matchMedia("(prefers-reduced-motion: reduce)").matches ? 100 : 900));
    };
    // The editor can still start inside the viewport while its first line is
    // covered by the sticky toolbar. CM margins are viewport-relative.
    const positiveTop = (rect(topbar).height + rect(toolbar).height) / 2;
    window.scrollTo(0, scrollY + rect(view.scrollDOM).top - positiveTop);
    await tick();
    assert(rect(view.scrollDOM).top > 0 && view.coordsAtPos(0).top < rect(toolbar).bottom, "Positive scroller offset starts with the first source line covered");
    view.dispatch({selection: {anchor: 0}, scrollIntoView: true});
    await tick();
    assert(view.coordsAtPos(0).top >= rect(toolbar).bottom - 1, "Cursor reveal clears the toolbar even when the scroller starts inside the viewport");
    await showSource();
    assert(view.scrollDOM.scrollHeight <= view.scrollDOM.clientHeight + 1, "Normal editor has no nested vertical scroller");
    window.scrollBy(0, 150);
    await tick();
    visibleControls("Manual page scroll");
    if (kind === "index") {
      assert(!document.querySelector(".topbar") && rect(toolbar).top === 0, "Warm-up toolbar sticks to the top without phantom navigation clearance");
    } else {
      topbar.style.height = "4rem";
      await tick();
      assert(Math.abs(rect(toolbar).top - rect(topbar).bottom) <= 1, "Toolbar follows the measured navigation height");
      topbar.style.height = "";
      await tick();
    }
    const focusState = () => ({
      documentFocused: document.hasFocus(), editorFocused: view.hasFocus,
      activeElement: document.activeElement?.tagName + "." + document.activeElement?.className,
      editorIsActive: document.activeElement === view.contentDOM,
      selection: view.state.selection.toJSON(),
    });
    view.focus();
    const beforeRun = focusState();
    const selection = view.state.selection.toJSON();
    view.contentDOM.dispatchEvent(new KeyboardEvent("keydown", {key: "Enter", code: "Enter", keyCode: 13, metaKey: /Mac/.test(navigator.platform), ctrlKey: !/Mac/.test(navigator.platform), bubbles: true, cancelable: true}));
    await tick();
    visibleControls("Running");
    assert(pending.length === 1 && scrolls.length === 0 && panel.style.display === "none", "Keyboard Run does not reveal output before results arrive");
    await finish(failure);
    resultsVisible("Compile failure");
    assert(view.hasFocus && JSON.stringify(view.state.selection.toJSON()) === JSON.stringify(selection), `Keyboard Run preserves focus and selection, without source navigation: ${JSON.stringify({before: beforeRun, after: focusState()})}`);
    assert(scrolls[0].behavior === (matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth"), "Native scrolling respects reduced motion");

    const nextRun = next.querySelector('[data-role="run-btn"]');
    const nextPanel = next.querySelector('[data-role="output-panel"]');
    const nextResultsVisible = () => {
      const head = rect(next.querySelector('[data-role="editor-toolbar"]'));
      assert(head.top >= rect(topbar).bottom - 1 && rect(nextPanel).top >= head.bottom - 1 && rect(nextPanel).top < innerHeight, "The newer editor's results remain in view");
    };
    // B is already pending when an aligned rerun of A makes no viewport move.
    // There is no synthetic scrollend: only the browser's actual scroll events.
    nextRun.click();
    const delayedB = pending.shift();
    await tick();
    // The first reveal may have changed CM's height estimate. Establish an
    // aligned viewport explicitly before testing a genuine no-op rerun.
    originalScroll.call(panel, {behavior: "instant", block: "start", inline: "nearest"});
    await tick();
    let viewportScrolls = 0;
    const countScroll = event => { if (event.target === document) viewportScrolls++; };
    document.addEventListener("scroll", countScroll);
    role("run-btn").click();
    await finish(failure);
    document.removeEventListener("scroll", countScroll);
    assert(viewportScrolls === 0, `An already aligned rerun is an actual no-op viewport scroll (${viewportScrolls} events)`);
    const afterNoOp = scrolls.length;
    pending.push(delayedB);
    await finish(failure);
    assert(scrolls.length === afterNoOp, "A no-op rerun cannot hijack another editor's later scrollend");
    nextResultsVisible();

    // Start A's output animation, then replace it with B's response.
    role("run-btn").click();
    const movingA = pending.shift();
    nextRun.click();
    const movingB = pending.shift();
    movingA.resolve(failure);
    await tick();
    const afterAStarted = scrolls.length;
    pending.push(movingB);
    await finish(failure);
    assert(scrolls.length === afterAStarted, "Overlapping output responses supersede older corrections across mounts");
    nextResultsVisible();

    role("run-btn").focus();
    role("run-btn").click();
    elsewhere.focus({preventScroll: true});
    await finish({...failure, stderr: failure.stderr.repeat(40)});
    resultsVisible("Tall output");
    assert(document.activeElement === elsewhere, "A response never steals focus from another control");

    role("run-btn").click();
    await finish({success: false, stdout: "assertion failed", test_results: [{name: "example", passed: false}]});
    resultsVisible("Test failure");
    role("run-btn").click();
    await finish({success: true, stdout: "ok", test_results: [{name: "example", passed: true}]});
    resultsVisible("Success / Submitted");
    if (kind === "exercise") assert(role("submit-btn").textContent.includes("Submitted"), "Saved controls remain available after autosubmit");

    localStorage.setItem("corrode:editor:scroll-output", "0");
    await showSource();
    const calls = scrolls.length;
    role("run-btn").click();
    await finish(failure);
    assert(scrolls.length === calls, "Opt-out prevents output scrolling");
    localStorage.removeItem("corrode:editor:scroll-output");
    role("run-btn").click();
    api.setValue(source + "\n// New revision");
    await finish(failure);
    assert(scrolls.length === calls, "Stale response cannot scroll");

    view.focus();
    for (const number of [80, 30, 1]) {
      view.dispatch({selection: {anchor: view.state.doc.line(number).from}, scrollIntoView: true});
      await tick();
      const caret = view.coordsAtPos(view.state.selection.main.head);
      assert(caret.top >= rect(toolbar).bottom - 1 && caret.bottom <= innerHeight, `Cursor scrolling keeps source line ${number} below toolbar`);
    }
    document.documentElement.dataset.editorFontSize = "large";
    await tick();
    view.dispatch({selection: {anchor: view.state.doc.line(30).from}, scrollIntoView: true});
    await tick();
    view.contentDOM.dispatchEvent(new KeyboardEvent("keydown", {key: "ArrowUp", code: "ArrowUp", keyCode: 38, bubbles: true, cancelable: true}));
    await tick();
    const caret = view.coordsAtPos(view.state.selection.main.head);
    assert(caret.top >= rect(toolbar).bottom - 1 && caret.bottom <= innerHeight, "Arrow navigation with a large editor font keeps the caret clear of the toolbar");
    delete document.documentElement.dataset.editorFontSize;
    await tick();
    window.scrollTo(0, scrollY + rect(next).top - 48);
    await tick();
    assert(rect(toolbar).bottom <= rect(next).top + 1, "The first toolbar stays bounded by its own section");
    const fallback = next.querySelector('[data-role="editor-fallback"]');
    assert(!next.querySelector(".cm-editor") && fallback.style.display !== "none", "The second production fixture exercises textarea fallback");
    fallback.focus();
    fallback.setSelectionRange(3, 12);
    fallback.dispatchEvent(new KeyboardEvent("keydown", {key: "Enter", ctrlKey: true, bubbles: true, cancelable: true}));
    await finish(failure);
    assert(document.activeElement === fallback && fallback.selectionStart === 3 && fallback.selectionEnd === 12, "Fallback keyboard Run preserves focus and both selection endpoints");
    const fallbackHead = rect(next.querySelector('[data-role="editor-toolbar"]'));
    const fallbackOutput = rect(next.querySelector('[data-role="output-panel"]'));
    assert(fallbackHead.top >= rect(topbar).bottom - 1 && fallbackOutput.top >= fallbackHead.bottom - 1 && fallbackOutput.top < innerHeight, "Fallback results clear their own toolbar");

    if (kind === "playground") {
      await showSource();
      role("fullscreen-btn").click();
      await tick();
      assert(section.classList.contains("is-fullscreen"), "Actual fullscreen button enters fullscreen");
      visibleControls("Fullscreen source");
      role("run-btn").click();
      await finish({...failure, stderr: failure.stderr.repeat(40)});
      visibleControls("Fullscreen output");
      assert(rect(panel).top >= rect(toolbar).bottom && rect(panel).bottom <= innerHeight + 1, "Fullscreen output fits without covering toolbar");
      assert(rect(view.scrollDOM).height > 20 && rect(view.scrollDOM).bottom <= rect(panel).top, "Fullscreen code remains usable above output");
      // Programmatic button activation does not dispatch pointer/keyboard input
      // that would otherwise mask a dangling fullscreen correction.
      role("fullscreen-btn").click();
      await tick();
      const afterFullscreen = scrolls.length;
      window.scrollTo(0, document.documentElement.scrollHeight);
      await tick();
      assert(scrolls.length === afterFullscreen, "Fullscreen output leaves no correction for an unrelated later viewport scroll");
      role("fullscreen-btn").click();
      document.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
      await tick();
      assert(!section.classList.contains("is-fullscreen"), "Escape exits fullscreen");
      await showSource();
      assert(view.scrollDOM.scrollHeight <= view.scrollDOM.clientHeight + 1, "Exiting fullscreen restores normal editor flow");
    }
    await showSource();
    if (params.has("fullscreen")) { role("fullscreen-btn").click(); await tick(); }
    assert(errors.length === 0, `No browser errors: ${errors.join("; ")}`);
    checks.dataset.result = "passed";
    checks.textContent = `${messages.length} ${kind} layout checks passed at ${innerWidth}×${innerHeight}\n` + messages.map(message => `✓ ${message}`).join("\n");
  } catch (error) {
    checks.dataset.result = "failed";
    checks.textContent = messages.join("\n") + "\nFAILED: " + error.stack;
    if (section) checks.textContent += "\nGeometry: " + JSON.stringify(Object.fromEntries(["editor-toolbar", "run-btn", "output-panel"].map(role => [role, section.querySelector(`[data-role="${role}"]`)?.getBoundingClientRect().toJSON()])));
  } finally {
    window.fetch = originalFetch;
  }
}
</script>
</html>
