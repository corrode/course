[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Keep exercise targets at the root for `cargo test --example <chapter>`.
[package]
name = "course-exercises"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.exercises.13_the_question_mark_operator]
difficulty = "beginner"
tags = ["question-mark", "result", "error-handling"]


[workspace.dependencies]
course-types = { path = "crates/course-types" }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.dev]
# Faster dev builds: keep enough debug info for backtraces, drop the rest.
debug = "line-tables-only"

[lints]
workspace = true

[workspace.lints.clippy]
# Lint groups need a lower priority than individual lint overrides so the
# `allow` entries below actually win against the group-level `warn`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# These crates are internal course infrastructure, not published to crates.io.
cargo_common_metadata = "allow"
# The dependency graph contains unavoidable duplicate transitive versions
# (for example getrandom, hashbrown, and webpki-roots). Audit with
# `cargo tree -d` when updating dependencies.
multiple_crate_versions = "allow"
# The `#[derive(Template)]` macro from askama expands to code that
# triggers `manual_div_ceil`. Not actionable in our source.
manual_div_ceil = "allow"
